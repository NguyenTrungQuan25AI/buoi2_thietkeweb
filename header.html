<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quán Cà Phê - Thực Đơn</title>
</head>
<body>

    <!-- Thẻ <header>: Chứa nội dung giới thiệu/mở đầu của trang, 
         thường gồm logo, tên thương hiệu và menu điều hướng chính -->
    <header>

        <!-- Logo và tên quán -->
        <div class="branding">
            <img src="images/logo.png" alt="Logo quán cà phê" width="60">
            <h1>Góc Phố Cà Phê</h1>
            <p class="slogan">Đậm đà hương vị - Ấm áp tình thân</p>
        </div>

        <!-- Thẻ <nav>: Đại diện cho một khối liên kết điều hướng chính của trang.
             Mỗi liên kết trỏ đến từng section trong phần main (dùng thẻ neo #id) -->
        <nav>
            <ul>
                <li><a href="#coffee">Cà Phê</a></li>
                <li><a href="#tea-cakes">Trà & Bánh</a></li>
                <li><a href="#snacks">Món Ăn Nhẹ</a></li>
                <li><a href="#service-hours">Giờ Phục Vụ</a></li>
            </ul>
        </nav>

    </header>

    <!-- Phần main sẽ được chèn vào đây bởi thành viên phụ trách -->

</body>
</html>
